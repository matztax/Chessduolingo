name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projektstruktur herstellen
        run: |
          mkdir -p app/src/main/java/com/example/schachhelfer
          mv MainActivity.kt CaptureService.kt BoardDetector.kt app/src/main/java/com/example/schachhelfer/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schachhelfer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
